name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA to build and release"
        required: true
        type: string
      version:
        description: "Version without the v (e.g. 0.1.0 or 0.1.0-hotfix1); notes go in docs/releases/<version>.md"
        required: true
        type: string
      reuse_run:
        description: "Optional previous run IDs, comma-separated; their artifacts are added to the release. Disable the builds you want to reuse."
        required: false
        type: string
        default: ""
      build_arch:
        description: "Include Arch Linux x86_64 build?"
        required: true
        type: boolean
        default: true
      build_arch_arm64:
        description: "Include Arch Linux ARM64 build?"
        required: true
        type: boolean
        default: true
      build_rpm:
        description: "Include Fedora x86_64 RPM build?"
        required: true
        type: boolean
        default: true
      build_rpm_arm64:
        description: "Include Fedora ARM64 RPM build?"
        required: true
        type: boolean
        default: true
      build_deb:
        description: "Include Debian x86_64 build?"
        required: true
        type: boolean
        default: true
      build_deb_arm64:
        description: "Include Debian ARM64 build?"
        required: true
        type: boolean
        default: true
      build_flatpak:
        description: "Include Flatpak build? x86_64 only"
        required: true
        type: boolean
        default: true
      build_appimage:
        description: "Include x86_64 AppImage build?"
        required: true
        type: boolean
        default: true
      build_appimage_arm64:
        description: "Include ARM64 AppImage build?"
        required: true
        type: boolean
        default: true
      build_nix:
        description: "Include Nix x86_64 build?"
        required: true
        type: boolean
        default: true
      build_nix_arm64:
        description: "Include Nix ARM64 build?"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      tag: ${{ steps.meta.outputs.tag }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Check commit, version, notes and toggles
        id: meta
        env:
          COMMIT: ${{ inputs.commit }}
          RAW_VERSION: ${{ inputs.version }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          BUILD_ARCH: ${{ inputs.build_arch }}
          BUILD_ARCH_ARM64: ${{ inputs.build_arch_arm64 }}
          BUILD_RPM: ${{ inputs.build_rpm }}
          BUILD_RPM_ARM64: ${{ inputs.build_rpm_arm64 }}
          BUILD_DEB: ${{ inputs.build_deb }}
          BUILD_DEB_ARM64: ${{ inputs.build_deb_arm64 }}
          BUILD_FLATPAK: ${{ inputs.build_flatpak }}
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_APPIMAGE_ARM64: ${{ inputs.build_appimage_arm64 }}
          BUILD_NIX: ${{ inputs.build_nix }}
          BUILD_NIX_ARM64: ${{ inputs.build_nix_arm64 }}
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$COMMIT^{commit}")" ]; then
            echo "::error::checked out commit does not match $COMMIT"
            exit 1
          fi

          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-hotfix[0-9]+)?$ ]]; then
            echo "::error::version must look like 0.1.0 or 0.1.0-hotfix1 (no v)"
            exit 1
          fi
          package_version="${version//-/.}"
          tag="v$version"
          if [ -n "${REUSE_RUN:-}" ]; then
            IFS=',' read -ra reuse_runs <<< "$REUSE_RUN"
            for run in "${reuse_runs[@]}"; do
              run="$(echo "$run" | xargs)"
              if [[ ! "$run" =~ ^[0-9]+$ ]]; then
                echo "::error::reuse_run must be numeric run ids separated by commas"
                exit 1
              fi
            done
          fi

          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          lock_version="$(grep -A1 '^name = "roseline"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Cargo.toml says $cargo_version, not $version"
            exit 1
          fi
          if [ "$lock_version" != "$version" ]; then
            echo "::error::Cargo.lock says $lock_version, not $version; run cargo update -p roseline"
            exit 1
          fi

          notes=""
          for candidate in "docs/releases/$version.md" "docs/releases/v$version.md"; do
            if [ -s "$candidate" ]; then
              notes="$candidate"
              break
            fi
          done
          if [ -z "$notes" ]; then
            echo "::error::missing or empty release notes: docs/releases/$version.md"
            exit 1
          fi

          selected=0
          for flag in "$BUILD_ARCH" "$BUILD_ARCH_ARM64" "$BUILD_RPM" "$BUILD_RPM_ARM64" \
            "$BUILD_DEB" "$BUILD_DEB_ARM64" "$BUILD_FLATPAK" \
            "$BUILD_APPIMAGE" "$BUILD_APPIMAGE_ARM64" "$BUILD_NIX" "$BUILD_NIX_ARM64"; do
            if [ "$flag" = "true" ]; then
              selected=1
            fi
          done
          if [ "$selected" -ne 1 ] && [ -z "${REUSE_RUN:-}" ]; then
            echo "::error::select at least one build, or set reuse_run"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; delete it first"
            exit 1
          fi

          {
            echo "version=$version"
            echo "package_version=$package_version"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

  arch:
    name: Arch package (${{ matrix.arch }})
    needs: validate
    if: ${{ inputs.build_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          # Arch Linux ARM publishes no official image
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      # github's arm runners cannot apply pacman's landlock sandbox
      image: ${{ matrix.image }}
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialise the Arch Linux ARM keyring
        if: ${{ matrix.arch == 'aarch64' }}
        run: pacman-key --init && pacman-key --populate archlinuxarm
      - name: Install git for checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Build package
        if: ${{ matrix.arch == 'x86_64' || inputs.build_arch_arm64 }}
        env:
          PKG_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed base-devel rust cargo gtk4 libadwaita libsecret glib2 pkgconf zstd
          make dist VERSION="$PKG_VERSION"
          cp build-aux/PKGBUILD build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$PKG_VERSION/" build/PKGBUILD
          useradd -m builder
          grep -E '^(CARCH|PKGEXT|COMPRESSION)' /etc/makepkg.conf || true
          cp /etc/makepkg.conf build/mk.conf
          printf "PKGEXT='.pkg.tar.zst'\n" >> build/mk.conf
          chown -R builder:builder "$PWD"
          su builder -s /bin/bash -c "cd '$PWD/build' && MAKEPKG_CONF='$PWD/build/mk.conf' makepkg --noconfirm --nocheck"
          find "$PWD" -maxdepth 3 -name 'roseline-*.pkg.tar.zst' -print -exec mv -t build/ {} \;
          ls -l build/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.arch == 'x86_64' || inputs.build_arch_arm64 }}
        with:
          name: arch-${{ matrix.arch }}
          path: build/roseline-${{ needs.validate.outputs.package_version }}-1-${{ matrix.arch }}.pkg.tar.zst
          if-no-files-found: error

  rpm:
    name: Fedora RPM (${{ matrix.arch }})
    needs: validate
    if: ${{ inputs.build_rpm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: fedora:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: dnf install -y git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Build package
        if: ${{ matrix.arch == 'x86_64' || inputs.build_rpm_arm64 }}
        env:
          PKG_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          dnf install -y rpm-build make gcc cargo rust gtk4-devel libadwaita-devel libsecret-devel glib2-devel
          make dist VERSION="$PKG_VERSION"
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "build/roseline-$PKG_VERSION.tar.gz" rpmbuild/SOURCES/
          sed "s/^Version:.*/Version:        $PKG_VERSION/" build-aux/roseline.spec > rpmbuild/SPECS/roseline.spec
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/roseline.spec
          cp rpmbuild/RPMS/*/*.rpm build/
          ls -l build/*.rpm
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.arch == 'x86_64' || inputs.build_rpm_arm64 }}
        with:
          name: rpm-${{ matrix.arch }}
          path: build/*.rpm
          if-no-files-found: error

  deb:
    name: Debian package (${{ matrix.arch }})
    needs: validate
    if: ${{ inputs.build_deb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Build package
        if: ${{ matrix.arch == 'x86_64' || inputs.build_deb_arm64 }}
        run: |
          set -euo pipefail
          apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libsecret-1-dev libglib2.0-dev curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          cargo build --release --locked
          ./build-aux/make-deb.sh
          ls -l build/*.deb
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.arch == 'x86_64' || inputs.build_deb_arm64 }}
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: validate
    if: ${{ inputs.build_appimage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Build package
        if: ${{ matrix.arch == 'x86_64' || inputs.build_appimage_arm64 }}
        run: |
          set -euo pipefail
          apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libsecret-1-dev \
            libglib2.0-dev curl file imagemagick
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          ./build-aux/make-appimage.sh
          ls -l build/*.AppImage
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.arch == 'x86_64' || inputs.build_appimage_arm64 }}
        with:
          name: appimage-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: validate
    if: ${{ inputs.build_flatpak }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        - /var/lib/flatpak
        - /var/tmp
      env:
        TMPDIR: /var/tmp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Add Flathub
        run: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Roseline-${{ needs.validate.outputs.version }}-x86_64.flatpak
          manifest-path: build-aux/net.buwryy.Roseline.yml
          arch: x86_64
          cache-key: roseline-flatpak-x86_64-${{ inputs.commit }}
          upload-artifact: "false"
      - name: Stage bundle
        run: |
          set -euo pipefail
          mkdir -p build
          find "$GITHUB_WORKSPACE" -maxdepth 1 -name 'Roseline-*.flatpak' -print -exec mv {} build/ \;
          ls -l build/*.flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: build/*.flatpak
          if-no-files-found: error

  nix:
    name: Nix build (${{ matrix.arch }})
    needs: validate
    if: ${{ inputs.build_nix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build package
        if: ${{ matrix.arch == 'x86_64' || inputs.build_nix_arm64 }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^  version = \".*\";/  version = \"$VERSION\";/" nix/package.nix
          nix build .#roseline --print-build-logs
          mkdir -p build/nix
          cp -a result/. build/nix/
          tar -C build/nix -cJf "build/roseline-$VERSION-${{ matrix.arch }}-nix.tar.xz" .
          ls -l build/*nix.tar.xz
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.arch == 'x86_64' || inputs.build_nix_arm64 }}
        with:
          name: nix-${{ matrix.arch }}
          path: build/*nix.tar.xz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [validate, arch, rpm, deb, appimage, flatpak, nix]
    if: ${{ always() && needs.validate.result == 'success' && (needs.arch.result == 'success' || needs.arch.result == 'skipped') && (needs.rpm.result == 'success' || needs.rpm.result == 'skipped') && (needs.deb.result == 'success' || needs.deb.result == 'skipped') && (needs.appimage.result == 'success' || needs.appimage.result == 'skipped') && (needs.flatpak.result == 'success' || needs.flatpak.result == 'skipped') && (needs.nix.result == 'success' || needs.nix.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: ${{ inputs.build_arch || inputs.build_rpm || inputs.build_deb || inputs.build_flatpak || inputs.build_appimage || inputs.build_nix }}
        with:
          path: dist
          merge-multiple: true
      - name: Reuse artifacts from earlier runs
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra runs <<< "$REUSE_RUN"
          for run in "${runs[@]}"; do
            run="$(echo "$run" | xargs)"
            [ -n "$run" ] || continue
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir "reuse-$run"
          done
          for dir in reuse-*; do
            [ -d "$dir" ] || continue
            find "$dir" -type f -exec mv -f {} dist/ \;
          done
          rm -rf reuse-*
          ls -lh dist
      - name: Check the selected artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PKG_VERSION: ${{ needs.validate.outputs.package_version }}
          BUILD_ARCH: ${{ inputs.build_arch }}
          BUILD_ARCH_ARM64: ${{ inputs.build_arch_arm64 }}
          BUILD_RPM: ${{ inputs.build_rpm }}
          BUILD_RPM_ARM64: ${{ inputs.build_rpm_arm64 }}
          BUILD_DEB: ${{ inputs.build_deb }}
          BUILD_DEB_ARM64: ${{ inputs.build_deb_arm64 }}
          BUILD_FLATPAK: ${{ inputs.build_flatpak }}
          BUILD_APPIMAGE: ${{ inputs.build_appimage }}
          BUILD_APPIMAGE_ARM64: ${{ inputs.build_appimage_arm64 }}
          BUILD_NIX: ${{ inputs.build_nix }}
          BUILD_NIX_ARM64: ${{ inputs.build_nix_arm64 }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"

          require() {
            compgen -G "dist/$1" >/dev/null || {
              echo "::error::missing release asset: $1"
              exit 1
            }
          }
          maybe_require() {
            if [ "$1" = "true" ]; then
              require "$2"
            fi
          }

          maybe_require "$BUILD_ARCH" "roseline-$PKG_VERSION-1-x86_64.pkg.tar.zst"
          maybe_require "$BUILD_ARCH_ARM64" "roseline-$PKG_VERSION-1-aarch64.pkg.tar.zst"
          maybe_require "$BUILD_RPM" "roseline-$PKG_VERSION-1.*.x86_64.rpm"
          maybe_require "$BUILD_RPM_ARM64" "roseline-$PKG_VERSION-1.*.aarch64.rpm"
          maybe_require "$BUILD_DEB" "roseline_${VERSION}_amd64.deb"
          maybe_require "$BUILD_DEB_ARM64" "roseline_${VERSION}_arm64.deb"
          maybe_require "$BUILD_FLATPAK" "Roseline-$VERSION-x86_64.flatpak"
          maybe_require "$BUILD_APPIMAGE" "Roséline-$VERSION-x86_64.AppImage"
          maybe_require "$BUILD_APPIMAGE_ARM64" "Roséline-$VERSION-aarch64.AppImage"
          maybe_require "$BUILD_NIX" "roseline-$VERSION-x86_64-nix.tar.xz"
          maybe_require "$BUILD_NIX_ARM64" "roseline-$VERSION-aarch64-nix.tar.xz"

          if [ -n "${REUSE_RUN:-}" ]; then
            echo "reused run ids: $REUSE_RUN"
          fi
      - name: Create the GitHub release
        env:
          # the built-in token cannot create tags or releases for commits that
          # touch .github/workflows; RELEASE_TOKEN is a PAT with workflows: write.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES: ${{ needs.validate.outputs.notes }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$COMMIT" \
            --title "Roséline v$VERSION" \
            --notes-file "$NOTES" \
            dist/*
